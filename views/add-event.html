<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Add Event - Class Project</title>

    <link rel="stylesheet"
        href="../css/style.css">

</head>


<body>

    <header>

        <h1>Class Project</h1>

        <nav>

            <a href="index.html">
                Events
            </a>

            <a href="add-event.html">
                Add Event
            </a>

            <a href="history.html">
                Booking History
            </a>

        </nav>

    </header>


    <main>

        <h2>Add New Event</h2>


        <form id="eventForm">

            <label>
                Event Name
            </label>

            <input
                type="text"
                id="eventName"
                required
            ><br><br>


            <label>
                Location
            </label>

            <input
                type="text"
                id="location"
                required
            ><br><br>


            <label>
                Date
            </label>

            <input
                type="date"
                id="date"
                required
            ><br><br>


            <label>
                Time
            </label>

            <input
                type="time"
                id="time"
                required
            ><br><br>


            <label>
                Gold Ticket Price
            </label>

            <input
                type="number"
                id="goldPrice"
                min="1"
                required
            ><br><br>


            <label>
                Silver Ticket Price
            </label>

            <input
                type="number"
                id="silverPrice"
                min="1"
                required
            ><br><br>


            <label>
                Available Seats
            </label>

            <input
                type="number"
                id="availableSeats"
                min="1"
                required
            ><br><br>


            <button type="submit">
                Add Event
            </button><br><br>

        </form>


        <div id="eventMessage"></div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="../js/service/apiConfig.js"></script>

    <script src="../js/service/eventService.js"></script>

    <script src="../js/addEvent.js"></script>

</body>

</html>
